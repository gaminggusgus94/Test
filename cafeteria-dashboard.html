<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Dashboard Salle Staff</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --header-h: 88px;
            --ticker-h: 70px;
            --weather-w: 410px;
            --gap: 20px;
            --pad: 28px;

            /* ── Palette ISART Digital ── */
            --bg:          #222945;   /* dark navy principal */
            --bg-mid:      #2F3852;   /* bleu-gris moyen */
            --bg-card:     #394464;   /* cartes */
            --border:      rgba(255,255,255,0.08);
            --text:        #F6F8F9;   /* blanc cassé */
            --text-dim:    rgba(246,248,249,0.50);

            --orange:      #FFAC4D;   /* accent primaire ISART */
            --orange-lite: #FAD488;   /* or clair */
            --cyan:        #15B2CC;   /* cyan secondaire ISART */
            --cyan-lite:   #7DD8E8;
            --navy:        #222945;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
        }

        /* lignes CRT subtiles */
        body::after {
            content: '';
            position: fixed; inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.04) 3px, rgba(0,0,0,0.04) 4px);
            pointer-events: none;
            z-index: 9999;
        }

        /* lueur ambiante ISART */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background:
                radial-gradient(ellipse at 8% 60%, rgba(255,172,77,.08) 0%, transparent 45%),
                radial-gradient(ellipse at 92% 60%, rgba(21,178,204,.08) 0%, transparent 45%);
            pointer-events: none;
            z-index: 0;
        }

        /* ─── EN-TÊTE ─── */
        #header {
            position: relative; z-index: 10;
            height: var(--header-h);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            background: var(--bg-mid);
            border-bottom: 2px solid var(--orange);
        }

        #logo { display: flex; align-items: center; gap: 18px; }
        #logo-emoji { font-size: 42px; }
        #logo-text {
            font-family: 'Rajdhani', sans-serif;
            font-size: 32px; font-weight: 700;
            color: var(--text);
            letter-spacing: 5px;
            text-transform: uppercase;
        }
        #logo-accent { color: var(--orange); }
        #logo-sub { font-size: 13px; color: var(--text-dim); letter-spacing: 4px; text-transform: uppercase; margin-top: 2px; font-weight: 500; }

        #live-badge {
            display: flex; align-items: center; gap: 9px;
            background: rgba(255,172,77,.12); border: 1px solid rgba(255,172,77,.35);
            border-radius: 6px; padding: 8px 20px;
            font-size: 14px; font-weight: 700; color: var(--orange); letter-spacing: 3px;
            font-family: 'Rajdhani', sans-serif;
        }
        #live-dot { width: 9px; height: 9px; background: var(--orange); border-radius: 50%; animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.75)} }

        #datetime { text-align: right; }
        #clock {
            font-family: 'Rajdhani', sans-serif;
            font-size: 58px; font-weight: 700; line-height: 1;
            color: var(--text); letter-spacing: 4px;
        }
        #date { font-size: 15px; color: var(--text-dim); margin-top: 4px; text-transform: capitalize; letter-spacing: 1px; font-weight: 500; }

        /* ─── CONTENU PRINCIPAL ─── */
        #main {
            position: relative; z-index: 1;
            display: flex;
            height: calc(1080px - var(--header-h) - var(--ticker-h));
        }

        /* ─── PANNEAU MÉTÉO ─── */
        #weather-panel {
            width: var(--weather-w);
            flex-shrink: 0;
            background: linear-gradient(175deg, #2a3560 0%, #1e2845 60%, #181f3a 100%);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 28px 26px;
            overflow: hidden;
            position: relative;
        }
        #weather-panel::before {
            content: '';
            position: absolute; top: -80px; right: -80px;
            width: 260px; height: 260px;
            background: radial-gradient(circle, rgba(21,178,204,.15) 0%, transparent 70%);
            border-radius: 50%; pointer-events: none;
        }

        #w-city { font-size: 14px; color: var(--cyan); text-transform: uppercase; letter-spacing: 4px; font-weight: 700; display: flex; align-items: center; gap: 8px; }

        #w-main { margin-top: 20px; display: flex; align-items: flex-start; gap: 12px; }
        #w-icon { font-size: 80px; line-height: 1; filter: drop-shadow(0 0 18px rgba(21,178,204,.45)); }
        #w-temp { font-family: 'Rajdhani', sans-serif; font-size: 92px; font-weight: 700; line-height: 1; color: var(--text); }
        #w-unit { font-size: 36px; color: var(--text-dim); }

        #w-desc { font-size: 20px; color: var(--cyan-lite); font-weight: 600; margin-top: 10px; }
        #w-feels { font-size: 14px; color: var(--text-dim); margin-top: 4px; }

        #w-details { margin-top: 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .w-detail {
            background: rgba(21,178,204,.07); border: 1px solid rgba(21,178,204,.18);
            border-radius: 8px; padding: 12px 14px;
        }
        .w-detail-lbl { font-size: 12px; color: var(--cyan); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; font-weight: 600; }
        .w-detail-val { font-size: 22px; font-weight: 700; color: var(--text); }

        #w-forecast { margin-top: 22px; flex: 1; }
        #w-forecast-title { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 3px; margin-bottom: 14px; font-weight: 600; }
        .fc-day { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
        .fc-day:last-child { border-bottom: none; }
        .fc-name { font-size: 15px; color: var(--text-dim); width: 96px; font-weight: 600; }
        .fc-icon { font-size: 26px; }
        .fc-temps { text-align: right; }
        .fc-max { font-size: 18px; font-weight: 700; color: var(--text); }
        .fc-min { font-size: 14px; color: var(--text-dim); }

        #w-error { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 16px; color: var(--text-dim); font-size: 16px; }

        /* ─── ZONE ACTUALITÉS ─── */
        #news-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

        .news-section { flex: 1; display: flex; flex-direction: column; padding: 18px var(--pad); overflow: hidden; min-height: 0; }
        .news-section:first-child { border-bottom: 1px solid var(--border); }

        .sec-header { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; flex-shrink: 0; }
        .sec-emoji { font-size: 26px; }
        .sec-title { font-family: 'Rajdhani', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
        .sec-title.g { color: var(--orange-lite); }
        .sec-title.s { color: var(--cyan-lite); }
        .sec-badge {
            padding: 4px 14px; border-radius: 4px;
            font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
            font-family: 'Rajdhani', sans-serif;
        }
        .sec-badge.g { background: rgba(255,172,77,.15); color: var(--orange); border: 1px solid rgba(255,172,77,.35); }
        .sec-badge.s { background: rgba(21,178,204,.15); color: var(--cyan); border: 1px solid rgba(21,178,204,.35); }
        .sec-dots { margin-left: auto; display: flex; gap: 7px; align-items: center; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.15); transition: background .4s, transform .4s; }
        .dot.active { transform: scale(1.3); }
        .dot.g.active { background: var(--orange); }
        .dot.s.active { background: var(--cyan); }

        /* ─── CARTES ─── */
        .cards-wrap { flex: 1; overflow: hidden; min-height: 0; position: relative; }
        .cards-track { display: flex; gap: var(--gap); height: 100%; }

        .news-card {
            flex: 1; min-width: 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: opacity .5s;
        }
        .news-card.g { border-top: 3px solid var(--orange); }
        .news-card.s { border-top: 3px solid var(--cyan); }

        .card-img {
            width: 100%; height: 180px;
            object-fit: cover; flex-shrink: 0; display: block;
        }
        .card-img-fallback {
            width: 100%; height: 180px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 52px;
        }
        .card-img-fallback.g { background: linear-gradient(135deg, #3a2a10, #5c3d15); }
        .card-img-fallback.s { background: linear-gradient(135deg, #0c2a3a, #0e3a50); }

        .card-body { padding: 14px 16px; flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .card-source { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 6px; flex-shrink: 0; font-family: 'Rajdhani', sans-serif; }
        .card-source.g { color: var(--orange); }
        .card-source.s { color: var(--cyan); }
        .card-title {
            font-size: 17px; font-weight: 700; line-height: 1.35; color: var(--text);
            flex-shrink: 0;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .card-desc {
            font-size: 14px; font-weight: 400; line-height: 1.5; color: var(--text-dim);
            flex: 1;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-time { font-size: 13px; color: var(--text-dim); margin-top: 8px; flex-shrink: 0; font-weight: 500; }

        .sec-loader { display: flex; align-items: center; justify-content: center; gap: 14px; height: 100%; color: var(--text-dim); font-size: 17px; }
        .spinner { width: 26px; height: 26px; border: 3px solid rgba(255,255,255,.1); border-top-color: var(--orange); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ─── BANDEAU DÉFILANT ─── */
        #ticker {
            height: var(--ticker-h);
            background: var(--bg-mid);
            border-top: 1px solid var(--border);
            display: flex; align-items: center;
            overflow: hidden; position: relative; z-index: 10;
        }
        #ticker-label {
            flex-shrink: 0; height: 100%;
            background: linear-gradient(90deg, var(--orange), #e8943a);
            display: flex; align-items: center;
            padding: 0 28px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px; font-weight: 700; letter-spacing: 4px;
            color: var(--navy); white-space: nowrap; z-index: 2;
            clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 0 100%);
            padding-right: 38px;
        }
        #ticker-wrap { flex: 1; overflow: hidden; }
        #ticker-inner { display: inline-flex; white-space: nowrap; animation: scroll-ticker 90s linear infinite; }
        @keyframes scroll-ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .tick-item { display: inline-flex; align-items: center; gap: 10px; padding: 0 40px; font-size: 18px; color: var(--text); font-weight: 500; }
        .tick-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
        .tick-dot.g { background: var(--orange); }
        .tick-dot.s { background: var(--cyan); }
        .tick-sep { color: rgba(255,255,255,.2); font-size: 10px; }
    </style>
</head>
<body>

<!-- ═══ EN-TÊTE ═══ -->
<div id="header">
    <div id="logo">

        <div>

    </div>

    </div>
</div>

<!-- ═══ CONTENU PRINCIPAL ═══ -->
<div id="main">

<script>
// ══════════════════════════════════════════════════════════════
//  ⚙️  CONFIGURATION
// ══════════════════════════════════════════════════════════════
const CFG = {
    city: 'Montreal',
    cardsPerView: 3,
    rotationMs: 9000,
    weatherRefreshMs: 10 * 60000,
    newsRefreshMs: 15 * 60000,

    // Flux RSS — Actualités jeux vidéo
    gamingFeeds: [
        'https://www.polygon.com/rss/index.xml',              // Polygon
        'https://kotaku.com/rss',                             // Kotaku
        'https://feeds.feedburner.com/ign/games-all',         // IGN
    ],

    // Flux RSS — Studios & industrie du jeu vidéo
    studioFeeds: [
        'https://www.gamesindustry.biz/rss',                  // GamesIndustry.biz
        'https://www.gamedeveloper.com/rss.xml',              // Game Developer
        'https://venturebeat.com/category/games/feed/',       // VentureBeat Games
    ],
};

// ══════════════════════════════════════════════════════════════
//  CODES MÉTÉO → EMOJI  (wttr.in)
// ══════════════════════════════════════════════════════════════
const W_ICON = {
    113:'☀️',116:'⛅',119:'☁️',122:'☁️',143:'🌫️',
    176:'🌦️',179:'🌨️',182:'🌧️',185:'🌧️',200:'⛈️',
    227:'🌨️',230:'❄️',248:'🌫️',260:'🌫️',263:'🌦️',
    266:'🌦️',281:'🌧️',284:'🌧️',293:'🌦️',296:'🌧️',
    299:'🌧️',302:'🌧️',305:'🌧️',308:'🌧️',311:'🌧️',
    314:'🌧️',317:'🌧️',320:'🌨️',323:'🌨️',326:'🌨️',
    329:'🌨️',332:'❄️',335:'❄️',338:'❄️',350:'🌧️',
    353:'🌦️',356:'🌧️',359:'🌧️',362:'🌨️',365:'🌨️',
    368:'🌨️',371:'❄️',374:'🌧️',377:'🌧️',386:'⛈️',
    389:'⛈️',392:'⛈️',395:'⛈️',
};

const DAYS_FR = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const MONTHS_FR = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

// ══════════════════════════════════════════════════════════════
//  HORLOGE
// ══════════════════════════════════════════════════════════════
function tickClock() {
    const now = new Date();
    document.getElementById('clock').textContent =
        [now.getHours(), now.getMinutes(), now.getSeconds()]
            .map(n => String(n).padStart(2, '0')).join(':');
    document.getElementById('date').textContent =
        `${DAYS_FR[now.getDay()]} ${now.getDate()} ${MONTHS_FR[now.getMonth()]} ${now.getFullYear()}`;
}
setInterval(tickClock, 1000);
tickClock();

// ══════════════════════════════════════════════════════════════
//  MÉTÉO  (wttr.in JSON API — gratuit, sans clé)
// ══════════════════════════════════════════════════════════════
async function loadWeather() {
    try {
        const r = await fetch(`https://wttr.in/${encodeURIComponent(CFG.city)}?format=j1`);
        if (!r.ok) throw new Error(r.status);
        const d = await r.json();
        renderWeather(d);
    } catch {
        document.getElementById('weather-body').innerHTML =
            `<div id="w-error"><span style="font-size:52px">⚠️</span><span>Météo indisponible</span></div>`;
    }
}

function renderWeather(d) {
    const cur = d.current_condition[0];
    const code = +cur.weatherCode;
    const icon  = W_ICON[code] || '🌡️';
    const temp  = cur.temp_C;
    const feels = cur.FeelsLikeC;
    const desc  = (cur.lang_fr?.[0]?.value) || cur.weatherDesc[0].value;
    const hum   = cur.humidity;
    const wind  = cur.windspeedKmph;
    const vis   = cur.visibility;

    const forecasts = d.weather.slice(0, 3).map((day, i) => {
        let name = i === 0 ? "Aujourd'hui" : i === 1 ? 'Demain' : DAYS_FR[new Date(day.date).getDay()];
        const ico = W_ICON[+(day.hourly[4]?.weatherCode ?? 113)] || '🌡️';
        return `<div class="fc-day">
            <span class="fc-name">${name}</span>
            <span class="fc-icon">${ico}</span>
            <div class="fc-temps">
                <div class="fc-max">${day.maxtempC}°</div>
                <div class="fc-min">${day.mintempC}°</div>
            </div>
        </div>`;
    }).join('');

    document.getElementById('weather-body').innerHTML = `
        <div id="w-main">
            <div id="w-icon">${icon}</div>
            <div>
                <div id="w-temp">${temp}<span id="w-unit">°C</span></div>
            </div>
        </div>
        <div id="w-desc">${desc}</div>
        <div id="w-feels">Ressenti ${feels}°C</div>
        <div id="w-details">
            <div class="w-detail"><div class="w-detail-lbl">💧 Humidité</div><div class="w-detail-val">${hum}%</div></div>
            <div class="w-detail"><div class="w-detail-lbl">💨 Vent</div><div class="w-detail-val">${wind} km/h</div></div>
            <div class="w-detail"><div class="w-detail-lbl">👁 Visibilité</div><div class="w-detail-val">${vis} km</div></div>
            <div class="w-detail"><div class="w-detail-lbl">🌡️ Ressenti</div><div class="w-detail-val">${feels}°C</div></div>
        </div>
        <div id="w-forecast">
            <div id="w-forecast-title">Prévisions 3 jours</div>
            ${forecasts}
        </div>`;
}

// ══════════════════════════════════════════════════════════════
//  RSS → JSON  (double fallback)
// ══════════════════════════════════════════════════════════════

function parseRSSXML(xmlStr) {
    try {
        const doc = new DOMParser().parseFromString(xmlStr, 'text/xml');
        if (doc.querySelector('parsererror')) return [];
        return Array.from(doc.querySelectorAll('item')).slice(0, 25).map(item => {
            const get = tag => item.querySelector(tag)?.textContent?.trim() ?? '';
            let thumbnail = '';
            for (const el of item.children) {
                if (el.localName === 'thumbnail') { thumbnail = el.getAttribute('url') ?? ''; break; }
            }
            if (!thumbnail) {
                const enc = item.querySelector('enclosure');
                if (enc && (enc.getAttribute('type') ?? '').startsWith('image'))
                    thumbnail = enc.getAttribute('url') ?? '';
            }
            if (!thumbnail) {
                const cnt = get('encoded') || get('description');
                const m = cnt.match(/<img[^>]+src=["']([^"']+)["']/i);
                if (m?.[1]?.startsWith('http')) thumbnail = m[1];
            }
            return {
                title: get('title'),
                pubDate: get('pubDate'),
                thumbnail,
                content: get('encoded') || get('description'),
                author: get('creator') || get('author'),
            };
        }).filter(it => it.title);
    } catch { return []; }
}

async function fetchFeed(url) {
    try {
        const r = await fetch(
            `https://api.rss2json.com/v1/api.json?count=25&rss_url=${encodeURIComponent(url)}`,
            { signal: AbortSignal.timeout(7000) }
        );
        const d = await r.json();
        if (d.status === 'ok' && d.items?.length) return d.items;
    } catch { /* fallback */ }

    const r2 = await fetch(
        `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
        { signal: AbortSignal.timeout(10000) }
    );
    const d2 = await r2.json();
    return parseRSSXML(d2.contents ?? '');
}

async function fetchFeeds(urls) {
    const results = await Promise.allSettled(urls.map(fetchFeed));
    const items = [];
    for (const r of results) if (r.status === 'fulfilled') items.push(...r.value);
    const seen = new Set();
    return items
        .filter(it => { const k = (it.title ?? '').trim().toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; })
        .sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
}

// ══════════════════════════════════════════════════════════════
//  UTILITAIRES CARTES
// ══════════════════════════════════════════════════════════════
function decodeHtml(s) {
    const t = document.createElement('textarea');
    t.innerHTML = s ?? '';
    return t.value;
}

function extractDesc(item) {
    const raw = item.description || item.content || '';
    const txt = raw.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
    const clean = decodeHtml(txt);
    return clean.length > 200 ? clean.slice(0, 200).replace(/\s\S*$/, '') + '…' : clean;
}

function timeAgo(str) {
    if (!str) return '';
    const diff = Date.now() - new Date(str);
    const m = Math.floor(diff / 60000);
    const h = Math.floor(diff / 3600000);
    const j = Math.floor(diff / 86400000);
    if (m < 1) return "À l'instant";
    if (m < 60) return `Il y a ${m} min`;
    if (h < 24) return `Il y a ${h}h`;
    return `Il y a ${j}j`;
}

function getImage(item) {
    if (item.thumbnail?.startsWith('http')) return item.thumbnail;
    if (item.enclosure?.link?.match(/\.(jpe?g|png|webp|gif)/i)) return item.enclosure.link;
    const m = (item.content ?? '').match(/<img[^>]+src=["']([^"']+)["']/i);
    if (m?.[1]?.startsWith('http')) return m[1];
    return null;
}

function buildCard(item, type) {
    const title = decodeHtml(item.title);
    const source = item.author || (type === 'g' ? 'Jeux Vidéo' : 'Studios');
    const imgUrl = getImage(item);
    const fallbackEmoji = type === 'g' ? '🎮' : '🏭';
    const imgHtml = imgUrl
        ? `<img class="card-img" src="${imgUrl}" alt="" loading="lazy"
              onerror="this.outerHTML='<div class=\\"card-img-fallback ${type}\\">${fallbackEmoji}</div>'">`
        : `<div class="card-img-fallback ${type}">${fallbackEmoji}</div>`;

    const desc = extractDesc(item);

    return `<div class="news-card ${type}">
        ${imgHtml}
        <div class="card-body">
            <div class="card-source ${type}">${source}</div>
            <div class="card-title">${title}</div>
            ${desc ? `<div class="card-desc">${desc}</div>` : ''}
            <div class="card-time">${timeAgo(item.pubDate)}</div>
        </div>
    </div>`;
}

// ══════════════════════════════════════════════════════════════
//  ROTATEUR DE CARTES
// ══════════════════════════════════════════════════════════════
function makeRotator(wrapId, dotsId, items, type) {
    const wrap = document.getElementById(wrapId);
    const dotsEl = document.getElementById(dotsId);

    if (!items.length) {
        wrap.innerHTML = `<div class="sec-loader"><span>Aucune actualité disponible</span></div>`;
        return null;
    }

    const n = CFG.cardsPerView;
    const pages = Math.ceil(items.length / n);
    let page = 0;

    const numDots = Math.min(pages, 8);
    dotsEl.innerHTML = Array.from({length: numDots}, (_, i) =>
        `<div class="dot ${type}" id="${dotsId}-${i}"></div>`).join('');

    function show(p) {
        const slice = items.slice(p * n, p * n + n);
        wrap.style.opacity = '0';
        wrap.style.transition = 'opacity .45s';
        setTimeout(() => {
            wrap.innerHTML = `<div class="cards-track">${slice.map(it => buildCard(it, type)).join('')}</div>`;
            wrap.style.opacity = '1';
        }, 220);
        dotsEl.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === p % numDots));
    }

    show(0);
    return setInterval(() => { page = (page + 1) % pages; show(page); }, CFG.rotationMs);
}

// ══════════════════════════════════════════════════════════════
//  BANDEAU DÉFILANT
// ══════════════════════════════════════════════════════════════
function updateTicker(gaming, studio) {
    const max = 15;
    const g = gaming.slice(0, max);
    const s = studio.slice(0, max);
    const mixed = [];
    for (let i = 0; i < Math.max(g.length, s.length); i++) {
        if (g[i]) mixed.push({it: g[i], type: 'g'});
        if (s[i]) mixed.push({it: s[i], type: 's'});
    }
    if (!mixed.length) return;

    const makeItems = arr => arr.map(({it, type}) =>
        `<span class="tick-item">
            <span class="tick-dot ${type}"></span>
            ${decodeHtml(it.title)}
         </span>
         <span class="tick-sep">◆</span>`
    ).join('');

    const inner = document.getElementById('ticker-inner');
    inner.innerHTML = makeItems(mixed) + makeItems(mixed);

    inner.style.animation = 'none';
    void inner.offsetWidth;
    const totalW = inner.scrollWidth;
    const dur = Math.max(60, (totalW / 2) / 110);
    inner.style.animation = `scroll-ticker ${dur}s linear infinite`;
}

// ══════════════════════════════════════════════════════════════
//  CHARGEMENT PRINCIPAL
// ══════════════════════════════════════════════════════════════
let timerG = null;
let timerS = null;

async function loadAll() {
    const [gaming, studio] = await Promise.all([
        fetchFeeds(CFG.gamingFeeds).catch(() => []),
        fetchFeeds(CFG.studioFeeds).catch(() => []),
    ]);

    if (timerG) clearInterval(timerG);
    if (timerS) clearInterval(timerS);

    timerG = makeRotator('wrap-gaming', 'dots-gaming', gaming, 'g');
    timerS = makeRotator('wrap-studio', 'dots-studio', studio, 's');

    updateTicker(gaming, studio);
}

loadWeather();
loadAll();

setInterval(loadWeather, CFG.weatherRefreshMs);
setInterval(loadAll, CFG.newsRefreshMs);
</script>
